<script>
(function(){
  const sources=[
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  let i=0;
  function loadNext(){
    if(window.XLSX){window.excelReaderReady=true;return}
    if(i>=sources.length){window.excelReaderReady=false;console.error('Excel import reader failed to load from all sources.');return}
    const sc=document.createElement('script');
    sc.src=sources[i++];sc.async=true;
    sc.onload=function(){if(window.XLSX){window.excelReaderReady=true}else loadNext()};
    sc.onerror=loadNext;
    document.head.appendChild(sc);
  }
  window.excelReaderReady=false;
  loadNext();
})();

<script>

function internalRole(r){return r==='Purchaser'?'Buyer':r==='Reciever'?'Receiver':r}

async function enterAs(selected){if(selected==='Client'){showClientWelcome();return}role=internalRole(selected);page='Dashboard';librarySearch='';inventorySearch='';libraryUnlocked=false;document.getElementById('role').value=displayRole(role);document.getElementById('welcomeScreen').style.display='none';await load()}

let librarySearch=''; let inventorySearch='';
const can={Estimator:['Dashboard','Jobs','Inventory','Digital Library','Quotes'],Receiver:['Dashboard','Jobs','Inventory','Digital Library','Ordering','Job Materials'],Designer:['Dashboard','Jobs','Inventory','Digital Library','Quotes','BOMs'],Buyer:['Dashboard','Jobs','Inventory','Digital Library','BOMs','Ordering','Job Materials','Vendors'],Admin:navs};
async function api(path,method='GET',data){let r=await fetch(path,{method,headers:data?{'Content-Type':'application/json'}:undefined,body:data?JSON.stringify(data):undefined});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error||r.statusText)}return r.json()}
async function load(){try{DB=await api('/api/data');DB.inventory=Array.isArray(DB.inventory)?DB.inventory:[];DB.products=Array.isArray(DB.products)?DB.products:[];DB.quotes=Array.isArray(DB.quotes)?DB.quotes:[];DB.boms=Array.isArray(DB.boms)?DB.boms:[];DB.vendors=Array.isArray(DB.vendors)?DB.vendors:[];DB.orders=Array.isArray(DB.orders)?DB.orders:[];DB.allocations=Array.isArray(DB.allocations)?DB.allocations:[];DB.settings={nextQuote:1001,nextBom:1001,nextPO:1001,serviceMarkups:{'Engineering / Designing':0,'Panel Layout':0,'Labeling':0,'Shop Labour':0,'Commissioning':0,'Travel':0,'Meals':0,'Miscellaneous / Other Services':0},...(DB.settings||{})};DB.settings.serviceMarkups={'Engineering / Designing':0,'Panel Layout':0,'Labeling':0,'Shop Labour':0,'Commissioning':0,'Travel':0,'Meals':0,'Miscellaneous / Other Services':0,...(DB.settings.serviceMarkups||{})};render()}catch(e){document.getElementById('app').innerHTML='<div class="notice"><b>Cannot connect to server.</b><br>Start the server with START VIRTUAL SHOP.bat.</div>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function next(type){let key=type==='Q'?'nextQuote':type==='B'?'nextBom':'nextPO';let n=Number(DB.settings[key]||1001);DB.settings[key]=n+1;api('/api/settings','PUT',{[key]:n+1}).catch(e=>console.error('Number update failed',e));return type+'-'+String(n).padStart(5,'0')}

const SERVICE_KEYS=['Engineering / Designing','Panel Layout','Labeling','Shop Labour','Commissioning','Travel','Meals','Miscellaneous / Other Services'];

function ensureQuoteServiceDefaults(q){
  let d=adminServiceSettings(),names=serviceItemNames();
  if(!Array.isArray(q.services))q.services=[];
  names.forEach(k=>{
    let x=q.services.find(v=>(v.description||v.name)===k);
    if(!x)q.services.push({description:k,hours:0,rate:Number(d[k]?.rate||0),markup:Number(d[k]?.markup||0)});

  });

function smartWordsDescription(v){
  let x=String(v||'').trim().replace(/\s+/g,' ');
  if(!x)return '';
  const fixes={
    'filtar':'filter','filtar':'filter','encloser':'enclosure','enclouser':'enclosure','disconect':'disconnect','dissconnect':'disconnect',
    'terminolgy':'terminal','terminology':'terminal','contacor':'contactor','contactar':'contactor','reciever':'receiver','reciver':'receiver',
    'volatge':'voltage','voltgae':'voltage','currnet':'current','curent':'current','transfomer':'transformer','tranformer':'transformer',
    'realy':'relay','relly':'relay','starterr':'starter','manufactureer':'manufacturer','stainles':'stainless','steal':'steel'
  };
  const acronyms=new Set(['ac','dc','vdc','vac','vfd','plc','hmi','mcc','mcp','nema','ss','ss304','ip','led','ups','spd','io','i/o','hp','kw','amp','amps','flA','din','pcb','rtd','poe','ul','csa']);
  const small=new Set(['and','or','of','for','with','to','from','in','on','by','c/w']);
  let words=x.toLowerCase().split(' ');
  words=words.map((w,i)=>{
    let lead=w.match(/^[^a-z0-9]*/i)?.[0]||'', tail=w.match(/[^a-z0-9%/.-]*$/i)?.[0]||'';
    let core=w.slice(lead.length,w.length-tail.length||undefined);
    let key=core.replace(/[^a-z]/g,'');
    if(fixes[key])core=core.replace(new RegExp(key,'i'),fixes[key]);
    let low=core.toLowerCase();
    if(acronyms.has(low))core=low.toUpperCase();
    else if(/^\d+(?:\.\d+)?(?:v|vac|vdc|a|amp|hp|kw|w)$/i.test(core))core=core.toUpperCase();
    else if(i>0&&small.has(low))core=low;
    else core=core.charAt(0).toUpperCase()+core.slice(1).toLowerCase();
    return lead+core+tail;
  });
  return words.join(' ');
}
async function ensureLibraryProduct(item){
  let pn=String(item.partNumber||'').trim(), maker=String(item.maker||'').trim();
  if(!pn)return null;
  let old=DB.products.find(p=>String(p.partNumber||'').trim().toLowerCase()===pn.toLowerCase());
  let clean=smartWordsDescription(item.description||pn);
  if(old){
    let changed=false, y={...old};
    if(clean && clean!==old.description){y.altDescriptions=[...(old.altDescriptions||[])];if(old.description&&!y.altDescriptions.includes(old.description))y.altDescriptions.push(old.description);if(!y.altDescriptions.includes(clean))y.altDescriptions.push(clean);changed=true}
    if(!y.maker&&maker){y.maker=maker;changed=true}
    if(changed)await api('/api/products','PUT',y);

async function saveVendorOrder(id){
  try{
    let o=DB.orders.find(x=>x.id===id);if(!o)return alert('Ordering sheet not found.');
    (o.items||[]).forEach((x,i)=>{
      let q=orderPurchaseQty(x);
      if(q<=0){
        x.selected=false;
        return;
      }
      let cb=document.getElementById('os_'+i);
      let sel=document.getElementById('ov_'+i);
      if(cb)x.selected=!!cb.checked;
      if(sel)x.selectedVendor=sel.value||'';
    });
    let active=(o.items||[]).filter(x=>orderPurchaseQty(x)>0 && x.selected!==false);
    let missing=active.filter(x=>!String(x.selectedVendor||'').trim());
    let receivingState=['Released to Receiver','Partially Received','Received Complete'].includes(o.status);
    if(receivingState){
      if(o.status==='Received Complete'){
        let totalNeed=(o.items||[]).reduce((n,x)=>n+orderPurchaseQty(x),0),totalRec=(o.items||[]).reduce((n,x)=>n+Number(x.receivedQty||0),0);
        if(totalRec<totalNeed)o.status='Partially Received';
      }
      o.changeRequestPending=missing.length>0;
    }else o.status=active.length && !missing.length ? 'Ready to Order' : 'Vendor Assignment';
    o.vendorAssignmentsUpdatedAt=new Date().toISOString();
    await api('/api/orders','PUT',o);
    closeModal();
    await load();
    page='Ordering';
    render();
  }catch(e){
    console.error('Vendor assignment save failed',e);
    alert('Vendor assignment could not be saved: '+(e.message||e));
  }
}
async function completeVendorOrdering(id){
  let o=DB.orders.find(x=>x.id===id);if(!o)return;
  let active=(o.items||[]).filter(x=>orderPurchaseQty(x)>0 && x.selected!==false);
  if(!active.length)return alert('No products are selected for vendor ordering.');
  let missing=active.filter(x=>!String(x.selectedVendor||'').trim());
  if(missing.length)return alert('Assign a vendor to every selected product first.');
  if(['Released to Receiver','Partially Received','Received Complete'].includes(o.status)){
    let totalNeed=(o.items||[]).reduce((n,x)=>n+orderPurchaseQty(x),0),totalRec=(o.items||[]).reduce((n,x)=>n+Number(x.receivedQty||0),0);
    o.status=totalRec>=totalNeed?'Received Complete':(totalRec>0?'Partially Received':'Released to Receiver');
    o.changeRequestPending=false;
  }else o.status='Ordered - Awaiting Release';
  o.orderedAt=new Date().toISOString();
  await api('/api/orders','PUT',o);
  await load();page='Ordering';render();
}

async function saveReceiving(id){
  let o=DB.orders.find(x=>x.id===id);if(!o)return;
  let totalOrdered=0,totalReceived=0;
  (o.items||[]).forEach((x,i)=>{
    let oq=Number(x.orderQty??x.qty??0);
    let rq=Math.max(0,Math.min(oq,Number(document.getElementById('recv_'+i)?.value||0)));
    x.receivedQty=rq;
    x.receiverInitials=(document.getElementById('rinit_'+i)?.value||'').trim();
    x.receiveNote=(document.getElementById('rnote_'+i)?.value||'').trim();
    totalOrdered+=oq; totalReceived+=rq;
  });
  let oldStatus=o.status;
  o.status=totalReceived<=0?'Released to Receiver':(totalReceived>=totalOrdered?'Received Complete':'Partially Received');
  o.receivedAt=new Date().toISOString();
  await api('/api/orders','PUT',o);
  addActivity(orderJob(o),'Receiving Update',`Order ${o.orderNo}: ${totalReceived}/${totalOrdered} received.`,{orderNo:o.orderNo,status:o.status});
  if(o.status==='Received Complete' && oldStatus!=='Received Complete'){
    handoffNotify(orderJob(o),'Receiving','Complete','Purchaser','Ordering',`Order ${o.orderNo} for Job ${orderJob(o)} is fully received.`);
  }
  closeModal();await load();page='Ordering';render();
}

async function importExcelLibrary(input){let file=input.files&&input.files[0];input.value='';if(!file)return;if(typeof XLSX==='undefined')return alert('Excel file loader is still loading or could not connect. Wait a few seconds and try again. If it still fails, check internet access on the computer running the browser.');try{let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),rows=[];wb.SheetNames.forEach(sn=>{let r=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false});r.forEach(x=>rows.push({...x,__sheet:sn}))});let parsed=rows.map(r=>({job:pickCol(r,['Job Number','Job No','Job #','Job','Project Number','Project No']),description:smartWordsDescription(pickCol(r,['Product Description','Description','Item Description','Material Description'])),maker:pickCol(r,['Maker','Make','Manufacturer','Mfr']),partNumber:pickCol(r,['Part Number','Part No','Part #','Model','Catalog Number','Catalogue Number']),currentRating:pickCol(r,['Current Rating','Current','Amps','Amp Rating','FLA']),voltageRating:pickCol(r,['Voltage Ratings','Voltage Rating','Voltage','Volts']),price:pickCol(r,['Price','Unit Price','Cost','Unit Cost'])})).filter(x=>x.partNumber);if(!parsed.length)return alert('No Part Number column was found. Expected columns include Job Number, Product Description, Maker, Part Number, Current Rating, Voltage Ratings and Price.');

  let rows=p.items.map((x,i)=>{let status=x.old?'<span class="tag"><b>EXISTING PRODUCT</b></span>':'<span class="tag"><b>NEW PRODUCT</b></span>';let action=x.old?`<select id="ia_${i}"><option value="both" selected>Keep both descriptions</option><option value="old">Keep old description</option><option value="new">Use cleaned Excel description</option><option value="skip">Skip this part</option></select>`:'<span class="small">Will be added to Digital Library</span>';return `<tr><td>${status}</td><td>${esc(x.partNumber)}</td><td>${esc(x.maker||x.old?.maker||'')}</td><td>${esc(x.old?.description||'—')}</td><td><input id="id_${i}" value="${esc(smartWordsDescription(x.description||''))}" style="min-width:260px"></td><td>${esc(x.jobs.join(', ')||'—')}</td><td>${action}</td></tr>`}).join('');

async function commitExcelImport(){let p=pendingExcelImport;if(!p)return;let added=0,updated=0,skipped=0;for(let i=0;i<p.items.length;i++){let x=p.items[i],old=x.old; x.description=smartWordsDescription(document.getElementById('id_'+i)?.value||x.description); x.importDescriptions=[x.description,...(x.importDescriptions||[]).map(smartWordsDescription)].filter(Boolean); let action=old?(document.getElementById('ia_'+i)?.value||'both'):'new';if(action==='skip'){skipped++;continue}if(!old){await api('/api/products','POST',{description:x.description||x.partNumber,maker:x.maker,partNumber:x.partNumber,currentRating:x.currentRating,voltageRating:x.voltageRating,price:x.price,vendor:'',jobs:x.jobs,altDescriptions:x.importDescriptions.filter(d=>d&&d!==x.description),notes:'Imported from '+p.file});added++;continue}let y={...old};y.description=smartWordsDescription(y.description||x.description||x.partNumber);y.jobs=[...new Set([...(old.jobs||[]),...x.jobs])];y.altDescriptions=[...(old.altDescriptions||[])].map(smartWordsDescription).filter(Boolean);let newDescs=x.importDescriptions.filter(Boolean);if(action==='new'){if(y.description&&!y.altDescriptions.includes(y.description))y.altDescriptions.push(y.description);y.description=x.description||y.description}else if(action==='both'){for(let d of newDescs)if(d!==y.description&&!y.altDescriptions.includes(d))y.altDescriptions.push(d)}for(let f of ['maker','currentRating','voltageRating','price'])if(!y[f]&&x[f])y[f]=x[f];y.notes=(y.notes||'')+(y.notes?' | ':'')+'Imported history from '+p.file;await api('/api/products','PUT',y);updated++}pendingExcelImport=null;closeModal();await load();alert(`Import complete. ${added} new products added, ${updated} existing products updated, ${skipped} skipped.`)}

async function savePurchasingPlan(id,release){
  try{
    let b=DB.boms.find(x=>x.id===id);if(!b)return;
    let multiplier=Math.max(1,Math.floor(Number(document.getElementById('orderPanelMultiplier')?.value||b.orderPanelMultiplier||1)));
    b.orderPanelMultiplier=multiplier;
    let plan=ensurePurchasingPlan(b);
    for(let i=0;i<plan.length;i++){
      let x=plan[i],req=x.isExtra?Math.max(0,Number(document.getElementById('pr_'+i)?.value||0)):Number(x.requiredQty||0),
      ss=Math.max(0,Number(document.getElementById('pss_'+i)?.value||0)),desired=Math.max(0,Number(document.getElementById('pinv_'+i)?.value||0));
      if(ss>req)ss=req;if(desired>req-ss)desired=req-ss;
      let old=Number(x.inventoryQty||0),diff=desired-old,inv=purchasingInventory(x);
      if(diff>0){if(!inv||Number(inv.qty||0)<diff)throw new Error((x.partNumber||x.description)+': only '+Number(inv?.qty||0)+' additional piece(s) available in inventory.');inv.qty=Number(inv.qty||0)-diff;await api('/api/inventory','PUT',inv)}
      else if(diff<0&&inv){inv.qty=Number(inv.qty||0)+(-diff);await api('/api/inventory','PUT',inv)}
      x.requiredQty=req;x.shopSupplyQty=ss;x.inventoryQty=desired;x.shopQty=desired;x.orderQty=Math.max(0,req-ss-desired);
      let a=DB.allocations.find(a=>a.bomId===b.id&&samePart(a,x));
      if(desired>0){
        let rec={job:b.job,bomId:b.id,bomNumber:b.number,partNumber:x.partNumber||'',maker:x.maker||'',description:x.description||'',qty:desired,location:inv?.location||a?.location||'',status:a?.status||'Allocated From Shop',receiverNote:a?.receiverNote||'',jobMaterialLocation:a?.jobMaterialLocation||'',createdAt:a?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
        if(a){rec.id=a.id;await api('/api/allocations','PUT',rec)}else await api('/api/allocations','POST',rec)
      }else if(a)await api('/api/allocations?id='+encodeURIComponent(a.id),'DELETE')
    }
    (b.purchasingPlan||[]).forEach(x=>x.orderQty=orderPurchaseQty(x));b.purchasingPlan=plan;b.status=release?'Purchasing Planned':b.status;await api('/api/boms','PUT',b);await load();
    if(release){closeModal();await createOrders(id)}else{manageReleasedBOM(id);alert('Purchasing plan saved for '+multiplier+' panel(s). Designer BOM is unchanged.')}
  }catch(e){console.error(e);await load();alert('Could not save Purchaser plan: '+(e.message||e))}
}

function ensurePurchasingPlan(b){
  if(!Array.isArray(b.purchasingPlan))b.purchasingPlan=[];
  let plan=b.purchasingPlan;
  let multiplier=Math.max(1,Number(b.orderPanelMultiplier||1));
  for(let it of (b.items||[])){
    let designQty=Number(it.qty||0);
    let totalRequired=designQty*multiplier;
    let x=plan.find(p=>!p.isExtra&&samePart(p,it));
    if(!x){
      plan.push({description:it.description||'',maker:it.maker||'',partNumber:it.partNumber||'',designQty,requiredQty:totalRequired,shopSupplyQty:0,inventoryQty:0,orderQty:totalRequired,price:it.price||'',vendor:'',isExtra:false});
    }else{
      x.designQty=designQty;
      x.requiredQty=totalRequired;
      if(x.shopSupplyQty==null)x.shopSupplyQty=0;
      if(x.inventoryQty==null)x.inventoryQty=Number(x.shopQty||0);
      if(Number(x.shopSupplyQty||0)>x.requiredQty)x.shopSupplyQty=x.requiredQty;
      if(Number(x.inventoryQty||0)>x.requiredQty-Number(x.shopSupplyQty||0))x.inventoryQty=Math.max(0,x.requiredQty-Number(x.shopSupplyQty||0));
      x.orderQty=Math.max(0,Number(x.requiredQty||0)-Number(x.shopSupplyQty||0)-Number(x.inventoryQty||0));
    }
  }
  for(let x of plan){
    if(x.shopSupplyQty==null)x.shopSupplyQty=0;
    if(x.inventoryQty==null)x.inventoryQty=Number(x.shopQty||0);
    if(x.isExtra){
      x.designQty=0;
      x.requiredQty=Math.max(0,Number(x.requiredQty||0));
    }
    x.orderQty=Math.max(0,Number(x.requiredQty||0)-Number(x.shopSupplyQty||0)-Number(x.inventoryQty||0));
  }
  return plan
}

function previewOrderPanelMultiplier(id){
  let b=DB.boms.find(x=>x.id===id);if(!b)return;
  let n=Math.max(1,Math.floor(Number(document.getElementById('orderPanelMultiplier')?.value||1)));
  let plan=b.purchasingPlan||[];
  plan.forEach((x,i)=>{
    if(x.isExtra)return;
    let item=(b.items||[]).find(it=>samePart(it,x));

async function syncBOMToActiveOrder(b,reason){
  ensurePurchasingPlan(b);
  let plan=b.purchasingPlan||[];
  let o=DB.orders.find(x=>x.bomId===b.id);
  if(!o){ await api('/api/boms','PUT',b); return; }
  o.panelMultiplier=Math.max(1,Number(b.orderPanelMultiplier||1));
  for(let p of plan){
    let line=o.items.find(i=>samePart(i,p));
    if(line){
      line.designQty=Number(p.designQty||0);
      line.panelMultiplier=p.isExtra?1:o.panelMultiplier;
      line.requiredQty=Number(p.requiredQty||0);
      if(line.shopSupplyQty==null)line.shopSupplyQty=Number(p.shopSupplyQty||0);
      if(line.inventoryQty==null)line.inventoryQty=Number(p.inventoryQty||0);
      line.orderQty=orderPurchaseQty(line);
      line.qty=line.orderQty;
    }else{
      o.items.push({
        description:p.description||'',maker:p.maker||'',partNumber:p.partNumber||'',
        designQty:Number(p.designQty||0),panelMultiplier:p.isExtra?1:o.panelMultiplier,
        requiredQty:Number(p.requiredQty||0),shopSupplyQty:Number(p.shopSupplyQty||0),
        inventoryQty:Number(p.inventoryQty||0),orderQty:orderPurchaseQty(p),qty:orderPurchaseQty(p),
        selected:false,selectedVendor:'',receivedQty:0,receiverInitials:'',receiveNote:'',
        purchaserNote:'',changeRequest:true
      });
    }
  }
  let totalNeed=(o.items||[]).reduce((n,x)=>n+orderPurchaseQty(x),0);
  let totalRec=(o.items||[]).reduce((n,x)=>n+Number(x.receivedQty||0),0);
  if(o.status==='Received Complete' && totalRec<totalNeed)o.status='Partially Received';
  o.changeRequestPending=true;
  o.lastBOMSyncAt=new Date().toISOString();
  await api('/api/orders','PUT',o);
  await api('/api/boms','PUT',b);
}
async function saveMaterialRequest(job){

    b.changeRequests=Array.isArray(b.changeRequests)?b.changeRequests:[];

}

function updateQuoteTotal(id){
  let q=DB.quotes.find(x=>x.id===id);if(!q)return;

    let qty=Number(document.getElementById('qq_'+i)?.value||0);

  });
  let serviceCost=0,serviceSell=0;
  (q.services||[]).forEach((x,i)=>{
    let hrs=Number(document.getElementById('sh_'+i)?.value||0);
    let rate=Number(document.getElementById('sr_'+i)?.value||0);
    let markup=Number(document.getElementById('sm_'+i)?.value||0);
    let ext=hrs*rate, sell=ext*(1+markup/100);
    serviceCost+=ext;serviceSell+=sell;
    if(document.getElementById('sext_'+i))document.getElementById('sext_'+i).textContent=money(ext);
    if(document.getElementById('ssell_'+i))document.getElementById('ssell_'+i).textContent=money(sell);
  });
  let total=materialSell+serviceSell;

  if(box)box.innerHTML=`<b>Material Cost:</b> ${money(materialCost)} &nbsp; <b>Material Selling:</b> ${money(materialSell)} &nbsp; <b>Services Selling:</b> ${money(serviceSell)} &nbsp; <b>Quote Total:</b> ${money(total)}`;

}

function normalizeSheetRows(rows){

function buildPdfBytes(title,subtitle,sections){
  const enc=new TextEncoder(),W=792,H=612,M=32,fs=7.5,line=11;
  const pages=[];let items=[],y=H-M;
  function add(t,x,yy,size,bold){items.push({t:String(t??''),x,yy,size:size||fs,bold:!!bold})}
  function flush(){if(items.length){pages.push(items);items=[]}}
  function header(){add(title,M,H-M,15,true);let yy=H-M-20;if(subtitle){add(subtitle,M,yy,9,false);yy-=18}y=yy}
  function need(h){if(y-h<M){flush();header()}}
  header();
  (sections||[]).forEach(sec=>{
    need(30);
    if(sec.title){add(sec.title,M,y,10.5,true);y-=15}
    const heads=sec.headers||[],rows=sec.rows||[],cols=Math.max(1,heads.length,...rows.map(r=>(r||[]).length));
    const cw=(W-2*M)/cols;
    function putRow(row,bold){
      need(line+3);
      (row||[]).slice(0,cols).forEach((v,i)=>{
        let t=String(v??''),max=Math.max(3,Math.floor(cw/(fs*0.54))-1);
        if(t.length>max)t=t.slice(0,Math.max(1,max-1))+'~';
        add(t,M+i*cw,y,fs,bold);
      });
      y-=line;
    }
    if(heads.length)putRow(heads,true);
    rows.forEach(r=>putRow(r,false));
    y-=8;
  });
  flush();
  const obj=[];obj[1]='<< /Type /Catalog /Pages 2 0 R >>';obj[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';obj[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>';
  const pageIds=[];let next=5;
  pages.forEach(pg=>{
    let stream=pg.map(a=>'BT /'+(a.bold?'F2':'F1')+' '+a.size+' Tf '+a.x.toFixed(2)+' '+a.yy.toFixed(2)+' Td ('+pdfSafe(a.t)+') Tj ET').join('\n');
    const cid=next++,pid=next++;pageIds.push(pid);
    obj[cid]='<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'\nendstream';
    obj[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>';
  });
  obj[2]='<< /Type /Pages /Kids ['+pageIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>';
  const chunks=[enc.encode('%PDF-1.4\n')],offs=[0];let pos=chunks[0].length;
  for(let i=1;i<obj.length;i++){if(!obj[i])continue;offs[i]=pos;const b=enc.encode(i+' 0 obj\n'+obj[i]+'\nendobj\n');chunks.push(b);pos+=b.length}
  const xrefPos=pos,max=obj.length-1;let x='xref\n0 '+(max+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=max;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<< /Size '+(max+1)+' /Root 1 0 R >>\nstartxref\n'+xrefPos+'\n%%EOF';
  chunks.push(enc.encode(x));return joinBytes(chunks);
}

function rev64EnsurePurchasingPlan64(b){
